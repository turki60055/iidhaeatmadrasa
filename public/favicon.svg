<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="micBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle / Rounded Container) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="256" cy="230" r="160" fill="#10b981" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="220" r="100" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />

  <!-- Morning Sun / Broadcast Rays in Corner -->
  <g transform="translate(390, 110)" opacity="0.95">
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- 8 Rays -->
    <path d="M0 -32 L0 -24 M0 24 L0 32 M-32 0 L-24 0 M24 0 L32 0 M-22 -22 L-16 -16 M16 16 L22 22 M-22 22 L-16 16 M16 -16 L22 -22" 
          stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Center 4-point sparkle -->
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14" fill="#ffffff" />
  </g>

  <!-- Left Broadcast Radio Waves -->
  <g stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M 180 160 A 90 90 0 0 0 180 280" opacity="0.9" />
    <path d="M 145 130 A 135 135 0 0 0 145 310" stroke-width="7" opacity="0.6" />
    <path d="M 110 100 A 180 180 0 0 0 110 340" stroke-width="6" opacity="0.35" />
  </g>

  <!-- Right Broadcast Radio Waves -->
  <g stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M 332 160 A 90 90 0 0 1 332 280" opacity="0.9" />
    <path d="M 367 130 A 135 135 0 0 1 367 310" stroke-width="7" opacity="0.6" />
    <path d="M 402 100 A 180 180 0 0 1 402 340" stroke-width="6" opacity="0.35" />
  </g>

  <!-- Central School Audio & Book Composition with Shadow -->
  <g filter="url(#shadow)">
    <!-- Base Open Book (Education foundation) -->
    <g transform="translate(256, 368)">
      <!-- Left Page -->
      <path d="M 0 18 Q -70 5 -120 22 Q -125 -18 -5 -25 L 0 -12 Z" fill="#ffffff" opacity="0.95" />
      <path d="M 0 24 Q -70 12 -124 28 Q -126 15 -70 0 L 0 12 Z" fill="url(#goldGrad)" />
      <!-- Right Page -->
      <path d="M 0 18 Q 70 5 120 22 Q 125 -18 5 -25 L 0 -12 Z" fill="#ffffff" opacity="0.95" />
      <path d="M 0 24 Q 70 12 124 28 Q 126 15 70 0 L 0 12 Z" fill="url(#goldGrad)" />
      <!-- Book Spine / Star Ribbon -->
      <path d="M -4 -25 L 4 -25 L 4 30 L 0 25 L -4 30 Z" fill="#b45309" />
    </g>

    <!-- Microphone Stand Holder / Cradle -->
    <path d="M 195 210 C 195 285 317 285 317 210" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Stand Vertical Stem -->
    <line x1="256" y1="265" x2="256" y2="345" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Stand Base Joint -->
    <circle cx="256" cy="345" r="12" fill="url(#goldGrad)" />

    <!-- Microphone Capsule (Rounded Pill) -->
    <rect x="218" y="112" width="76" height="124" rx="38" fill="url(#micBodyGrad)" stroke="#ffffff" stroke-width="3" />

    <!-- Microphone Grille Mesh (Metallic Gold Band & Ribs) -->
    <rect x="218" y="152" width="76" height="14" fill="url(#goldGrad)" />
    
    <!-- Grille Slots (Horizontal Detail) -->
    <line x1="230" y1="130" x2="282" y2="130" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="226" y1="142" x2="286" y2="142" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="228" y1="180" x2="284" y2="180" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="234" y1="194" x2="278" y2="194" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="242" y1="208" x2="270" y2="208" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />

    <!-- "ON AIR" / LIVE School Beacon on mic center -->
    <circle cx="256" cy="159" r="5" fill="#ef4444" filter="url(#glow)" />

    <!-- Golden Laurel / Sparkle Accent in bottom center -->
    <g transform="translate(256, 420)">
      <!-- Broadcast Platform Arabic Wordmark or Subtitle Badge -->
      <rect x="-85" y="-12" width="170" height="26" rx="13" fill="#022c22" stroke="url(#goldGrad)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cairo', sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">
        أثير • إذاعة مدرسية
      </text>
    </g>
  </g>
</svg>